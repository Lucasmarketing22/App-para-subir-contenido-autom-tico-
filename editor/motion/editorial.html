<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!--
  Piezas de motion graphics, estilo A "editorial" (papel crema + serif). 1080x1920, fondo transparente.
  Determinista: window.render(t) dibuja el instante t (segundos). render_motion.js captura cada frame.
  Parámetros por URL: ?piece=<nombre>&data=<json urlencoded>
  Curvas: entradas expo.out / back.out(1.4), salidas power2.in. Perfil: editor/perfis/marca-personal.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter}
:root{--paper:#F4ECDD;--ink:#1d1a16;--red:#C8243A;--gold:#B8932F;--orange:#E9842C;--muted:#8a7d6b;--cream:#F6EEDF}
.abs{position:absolute}
.serif{font-family:'Liberation Serif',serif}
/* gancho */
#hook{left:0;right:0;top:240px;text-align:center;color:var(--cream);line-height:.86;text-shadow:0 6px 30px rgba(0,0,0,.35)}
#hook .l{display:block;will-change:transform,opacity}
#kicker{left:0;right:0;top:150px;text-align:center;font:600 30px Inter;letter-spacing:10px;color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.4)}
/* tarjeta de maridaje */
.card{left:70px;right:70px;bottom:230px;background:var(--paper);border-radius:28px;padding:38px 46px;display:flex;align-items:center;gap:32px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.num{font:italic 700 92px 'Liberation Serif';color:var(--red);min-width:110px}
.txt{flex:1;color:var(--ink)}
.txt small{display:block;font:600 24px Inter;letter-spacing:6px;color:var(--muted);margin-bottom:8px}
.txt b{font:700 58px 'Liberation Serif';display:block}
.txt em{font:italic 400 56px 'Liberation Serif';color:var(--gold);display:block}
.sw{width:112px;height:112px;border-radius:50%;border:6px solid var(--ink)}
/* pantalla "color del plato" */
#full{inset:0;background:var(--paper)}
#full .t1{left:0;right:0;top:560px;text-align:center;font:700 96px 'Liberation Serif';color:var(--ink)}
#full .t2{left:0;right:0;top:680px;text-align:center;font:italic 400 150px 'Liberation Serif';color:var(--red);line-height:1}
#plate{left:340px;top:1060px;width:400px;height:400px;border-radius:50%;background:#fff;border:14px solid var(--ink);box-shadow:inset 0 0 0 40px rgba(0,0,0,.06)}
#plate .food{position:absolute;left:90px;top:90px;width:192px;height:192px;border-radius:50%}
/* resumen */
#sum{left:70px;right:70px;bottom:230px;background:var(--paper);border-radius:28px;padding:44px 40px 50px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#sum .a{font:700 64px 'Liberation Serif';color:var(--ink)}
#sum .eq{font:italic 400 64px 'Liberation Serif';color:var(--red)}
#sum .row{display:flex;justify-content:center;gap:40px;margin-top:30px}
#sum .row div{width:110px;height:110px;border-radius:50%;border:6px solid var(--ink)}
</style></head>
<body><div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const piece = P.get('piece'); const D = JSON.parse(P.get('data') || '{}');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const expoOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const backOut = (x, s = 1.4) => { x = clamp(x) - 1; return x * x * ((s + 1) * x + s) + 1; };
const p2in = x => x * x;
const prog = (t, start, dur) => clamp((t - start) / dur);
const root = document.getElementById('root');
const el = (html) => { root.insertAdjacentHTML('beforeend', html); return root.lastElementChild; };
let render = () => {};

if (piece === 'hook') {
  // D: {kicker, lines:[{html, size, at}], out}
  const k = el(`<div id="kicker" class="abs">${D.kicker}</div>`);
  const h = el(`<div id="hook" class="abs serif"></div>`);
  const ls = D.lines.map(l => { const s = document.createElement('span'); s.className = 'l'; s.style.fontSize = l.size + 'px';
    s.innerHTML = l.html; h.appendChild(s); return s; });
  render = t => {
    const out = 1 - p2in(prog(t, D.out - 0.25, 0.25));
    const pk = expoOut(prog(t, 0.1, 0.5));
    k.style.opacity = pk * out; k.style.letterSpacing = (24 - 14 * pk) + 'px';
    ls.forEach((s, i) => { const p = prog(t, D.lines[i].at, 0.45);
      s.style.opacity = clamp(p * 3) * out;
      s.style.transform = `translateY(${(1 - expoOut(p)) * 70}px) scale(${0.92 + 0.08 * backOut(p)})`;
      s.style.filter = `blur(${(1 - expoOut(p)) * 10}px)`; });
  };
}

if (piece === 'card') {
  // D: {n, label, a, b, color, dur}
  const c = el(`<div class="card abs"><div class="num">${D.n}</div><div class="txt"><small>${D.label}</small><b>${D.a}</b><em>→ ${D.b}</em></div><div class="sw" style="background:${D.color}"></div></div>`);
  const num = c.querySelector('.num'), b = c.querySelector('b'), em = c.querySelector('em'), sw = c.querySelector('.sw');
  render = t => {
    const pin = prog(t, 0, 0.5), pout = prog(t, D.dur - 0.3, 0.3);
    c.style.transform = `translateY(${(1 - expoOut(pin)) * 260 + p2in(pout) * 260}px)`;
    c.style.opacity = clamp(pin * 4) * (1 - pout);
    num.style.transform = `translateX(${(1 - expoOut(prog(t, 0.12, 0.45))) * -40}px)`;
    num.style.opacity = prog(t, 0.12, 0.2);
    b.style.opacity = prog(t, 0.2, 0.25); b.style.transform = `translateY(${(1 - expoOut(prog(t, 0.2, 0.4))) * 24}px)`;
    em.style.opacity = prog(t, 0.45, 0.25); em.style.transform = `translateX(${(1 - expoOut(prog(t, 0.45, 0.45))) * -30}px)`;
    const ps = prog(t, 0.55, 0.45); sw.style.transform = `scale(${backOut(ps, 2)})`; sw.style.opacity = clamp(ps * 4);
  };
}

if (piece === 'full') {
  // D: {t1, t2, colors:[...], dur}
  const f = el(`<div id="full" class="abs"><div class="t1 abs">${D.t1}</div><div class="t2 abs">${D.t2}</div><div id="plate" class="abs"><div class="food"></div></div></div>`);
  const t1 = f.querySelector('.t1'), t2 = f.querySelector('.t2'), plate = f.querySelector('#plate'), food = f.querySelector('.food');
  render = t => {
    const pin = prog(t, 0, 0.3), pout = prog(t, D.dur - 0.22, 0.22);
    f.style.opacity = expoOut(pin) * (1 - pout);
    f.style.clipPath = `circle(${expoOut(pin) * 120}% at 50% 60%)`;
    t1.style.opacity = prog(t, 0.15, 0.25); t1.style.transform = `translateY(${(1 - expoOut(prog(t, 0.15, 0.5))) * 40}px)`;
    t2.style.opacity = prog(t, 0.45, 0.25); t2.style.transform = `scale(${0.85 + 0.15 * backOut(prog(t, 0.45, 0.5))})`;
    const pp = prog(t, 0.6, 0.5); plate.style.transform = `scale(${backOut(pp, 1.6)}) rotate(${(1 - expoOut(pp)) * -40}deg)`; plate.style.opacity = clamp(pp * 4);
    const seg = (D.dur - 1.0) / D.colors.length; const i = Math.min(D.colors.length - 1, Math.max(0, Math.floor((t - 0.8) / seg)));
    const local = prog(t, 0.8 + i * seg, 0.18);
    food.style.background = D.colors[i]; food.style.transform = `scale(${0.6 + 0.4 * backOut(local, 2)})`;
  };
}

if (piece === 'summary') {
  // D: {a, eq, colors, dur}
  const s = el(`<div id="sum" class="abs"><div class="a">${D.a}</div><div class="eq">${D.eq}</div><div class="row">${D.colors.map(c => `<div style="background:${c}"></div>`).join('')}</div></div>`);
  const a = s.querySelector('.a'), eq = s.querySelector('.eq'), dots = [...s.querySelectorAll('.row div')];
  render = t => {
    const pin = prog(t, 0, 0.5), pout = prog(t, D.dur - 0.3, 0.3);
    s.style.transform = `translateY(${(1 - expoOut(pin)) * 260}px)`; s.style.opacity = clamp(pin * 4) * (1 - pout);
    a.style.opacity = prog(t, 0.15, 0.25); eq.style.opacity = prog(t, 0.5, 0.3);
    eq.style.transform = `translateY(${(1 - expoOut(prog(t, 0.5, 0.5))) * 20}px)`;
    dots.forEach((d, i) => { const p = prog(t, 0.8 + i * 0.15, 0.4); d.style.transform = `scale(${backOut(p, 2.2)})`; d.style.opacity = clamp(p * 4); });
  };
}
window.render = render; window.ready = true;
</script></body></html>
